services:
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: mobility-local
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra_data:/var/lib/cassandra
  cassandra-init:
    image: cassandra:5.0
    depends_on:
      cassandra:
        condition: service_started
    volumes:
      - ./cassandra/schema.cql:/schema.cql:ro
    entrypoint:
      - /bin/bash
      - -c
      - "until cqlsh cassandra -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1; do sleep 2; done; cqlsh cassandra -f /schema.cql"
  neo4j:
    image: neo4j:5.26
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
  spark:
    image: apache/spark:3.5.5
    user: root
    working_dir: /app
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-taxi-trips}
      CHECKPOINT_ROOT: /app/checkpoints/${KAFKA_TOPIC:-taxi-trips}
    depends_on:
      kafka:
        condition: service_started
      cassandra-init:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    command: >-
      /opt/spark/bin/spark-submit
      --master local[2]
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5,com.datastax.spark:spark-cassandra-connector_2.12:3.5.1
      --conf spark.cassandra.connection.host=cassandra
      --conf spark.sql.shuffle.partitions=4
      /app/spark/stream.py
    profiles: [stream]
volumes:
  kafka_data:
  cassandra_data:
  neo4j_data:
